name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    
    # Required for trusted publishing (no API token needed)
    permissions:
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: |
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing - configure at:
        # https://pypi.org/manage/project/sql-eval/settings/publishing/
        # Add GitHub as a trusted publisher with:
        #   - Owner: your-github-username
        #   - Repository: sql-eval
        #   - Workflow: publish.yml
