[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-eval"
version = "0.1.0"
description = "Open-source Text-to-SQL Evaluation Framework"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ajay Maurya", email = "ajaymauryabbn@gmail.com"}
]
keywords = ["text-to-sql", "nlp", "llm", "evaluation", "sql", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "sqlparse>=0.4.4",
    "psycopg2-binary>=2.9.0",
    "mysql-connector-python>=8.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
sql-eval = "sql_eval.cli:main"

[project.urls]
Homepage = "https://github.com/ajaymaurya/sql-eval"
Documentation = "https://github.com/ajaymaurya/sql-eval#readme"
Repository = "https://github.com/ajaymaurya/sql-eval"
Issues = "https://github.com/ajaymaurya/sql-eval/issues"

[tool.setuptools.packages.find]
include = ["sql_eval*"]

[tool.setuptools.package-data]
sql_eval = [
    "datasets/*/*.sql",
    "datasets/*/*.json",
    "datasets/*/*.csv",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
